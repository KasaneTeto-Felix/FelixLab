name: Supabase Keep Alive

on:
  schedule:
    # Berjalan otomatis setiap hari Selasa dan Jumat jam 00:00 UTC
    - cron: '0 0 * * 2,5'
  workflow_dispatch: # Agar bisa dijalankan manual jika mau

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/nama_tabel_anda?select=id&limit=1" \
          -H "apikey: ${{ secrets.SECRETS.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
          
